name: 🐛 Bug 报告 / Bug Report
description: 反馈一个问题，帮助我们改进 SnapLingo
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢反馈！请尽量填写完整，方便快速定位问题。
        请先搜索 [Issues](../../issues) 看是否已有人提过。
  - type: textarea
    id: what
    attributes:
      label: 问题描述 / What happened
      description: 发生了什么？期望结果是什么？
      placeholder: 按 Ctrl+Alt+O 后没有弹出框选遮罩，而是弹出一个报错窗口…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 怎么操作能稳定复现？
      placeholder: |
        1. 启动 SnapLingo
        2. 按 Ctrl+Alt+O
        3. 框选一段文字
        4. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 出问题的功能 / Which feature
      options:
        - 截图框选遮罩
        - OCR 识别（tesseract）
        - OCR 识别（API）
        - 翻译（含语种切换）
        - 设置 / 热键 / 开机自启
        - 打包 / 安装 / 启动
        - 其他
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本 / Windows version
      description: 例如 Windows 11 24H2 / Windows 10 22H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志 / Log
      description: 可选。日志位置：%APPDATA%\ScreenLingo\logs\screenlingo.log
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: 报错截图可以直接拖拽到本框。
  - type: checkboxes
    id: checks
    attributes:
      label: 自查清单 / Checklist
      options:
        - label: 我已搜索过 Issues，没有重复
          required: true
        - label: 我使用的是最新版本（Releases 最新 exe 或最新 main 分支）
