name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --windowed --name ScreenLingo `
            --hidden-import tkinter --collect-all pystray --icon icon.ico main.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\ScreenLingo.exe).Hash
          Set-Content -Path dist\SHA256.txt -Value $hash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScreenLingo.exe
            dist/SHA256.txt
